name: Orange EPG diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Query Orange DAZN Baloncesto 2 segment
        shell: bash
        run: |
          set -uo pipefail
          url="https://epg.orangetv.orange.es/epg/Smartphone_Android/1_PRO/$(date -u +%Y%m%d)_8h_1.json"
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT
          status="$(curl --silent --show-error --location --max-time 30 --dump-header "$headers" --output "$body" --write-out '%{http_code}' --header 'Accept: application/json' "$url" || true)"
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\\r", ""); value=$0} END{print value}' "$headers")"
          bytes="$(wc -c < "$body" | tr -d ' ')"
          sample="$(head -c 300 "$body" | tr '\n\r' '  ' | sed -E 's/(token|authorization|password|cookie)[=:][^ ,;}]*/\1=[REDACTED]/Ig')"
          printf 'URL: %s\nHTTP: %s\nContent-Type: %s\nResponse bytes: %s\nSample (first 300 bytes, sanitized): %s\n' "$url" "${status:-000}" "${content_type:-missing}" "$bytes" "${sample:-<empty>}"
          python - "$body" <<'PY'
          import json, sys
          from pathlib import Path
          body = Path(sys.argv[1]).read_bytes()
          try:
              data = json.loads(body)
          except Exception as exc:
              print(f"JSON parse: FAILED ({type(exc).__name__}: {exc})")
              raise SystemExit(0)
          blocks = data if isinstance(data, list) else []
          target = [b for b in blocks if str(b.get("channelExternalId")) == "11232"]
          programs = sum(len(b.get("programs", [])) for b in target)
          print(f"JSON parse: OK; top-level={type(data).__name__}; channel 11232 blocks={len(target)}; programmes={programs}")
          PY
      - name: Run complete Orange downloader for selected channels
        run: node scripts/commands/epg/grab-orange.cjs --channels=sites/orangetv.orange.es/orange-selected.channels.xml --days=2 --output="$RUNNER_TEMP/orange.xml"
