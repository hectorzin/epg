name: Generate Arabic EPG

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-publish-guide-arabic
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download upstream iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git upstream

      - name: Record upstream revision
        id: upstream
        working-directory: upstream
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install upstream dependencies
        working-directory: upstream
        run: npm ci --ignore-scripts

      - name: Load upstream channel metadata
        working-directory: upstream
        run: npm run api:load

      - name: Generate Arabic coverage
        id: generate
        working-directory: upstream
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.revision }}
          OUTPUT_DIR: ${{ runner.temp }}/arabic-epg-output
          HELPER: ${{ github.workspace }}/scripts/arabic-epg.py
          WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$OUTPUT_DIR"
          started=$(date +%s)
          echo "$started" > "$OUTPUT_DIR/start-time"
          sources=(
            "shahid:shahid.mbc.net:shahid.mbc.net_ar.channels.xml"
            "elcinema:elcinema.com:elcinema.com_ar.channels.xml"
            "osn:osn.com:osn.com_ar.channels.xml"
            "bein:bein.com:bein.com_ar.channels.xml"
            "beinsports:beinsports.com:beinsports.com_mena-ar.channels.xml"
            "aljazeera:aljazeera.com:aljazeera.com.channels.xml"
            "artonline:artonline.tv:artonline.tv.channels.xml"
            "ayn:ayn.om:ayn.om.channels.xml"
          )
          covered_guides=()
          successful_pairs=()
          run_source() {
            local name="$1" site="$2" catalog_name="$3"
            local catalog="sites/$site/$catalog_name"
            local selected="$OUTPUT_DIR/$name.channels.xml"
            local guide="$OUTPUT_DIR/$name.xml"
            local count
            local args=(select --catalog "$catalog" --output "$selected")
            for prior in "${covered_guides[@]}"; do args+=(--covered-guide "$prior"); done
            count=$(python "$HELPER" "${args[@]}") || return 0
            echo "$name: $count uncovered Arabic channels selected"
            if [[ "$count" == "0" ]]; then return 0; fi
            local grab_args=(run grab -- "--channels=$selected" --days=2 --maxConnections=3 --timeout=15000 "--output=$guide")
            if [[ "$name" == "elcinema" ]]; then
              grab_args=(run grab -- "--channels=$selected" --days=2 --maxConnections=1 --delay=1000 --timeout=15000 "--output=$guide")
            fi
            set +e
            npm "${grab_args[@]}" 2>&1 | tee "$OUTPUT_DIR/$name.log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$OUTPUT_DIR/$name.status"
          if [[ -s "$guide" ]] && python - "$guide" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          good=[p for p in root.findall('programme') if (p.findtext('title') or '').strip()]
          raise SystemExit(0 if root.tag=='tv' and good else 1)
          PY
            then
              covered_guides+=("$guide")
              successful_pairs+=("$selected=$guide")
            else
              echo "$name: no valid output; continuing with the remaining sources"
            fi
          }
          set -e
          for entry in "${sources[@]}"; do
            IFS=: read -r name site catalog <<< "$entry"
            run_source "$name" "$site" "$catalog"
          done
          merge_args=(merge --output "$OUTPUT_DIR/guide-arabic.xml")
          for pair in "${successful_pairs[@]}"; do merge_args+=(--pair "$pair"); done
          python "$HELPER" "${merge_args[@]}"
          occupied=()
          for national in guide-es.xml guide-fr.xml guide-gb.xml guide-pt.xml guide-nl.xml guide-it.xml guide-de.xml guide-tr.xml guide-be.xml guide-ca.xml guide-af.xml; do
            if [[ -f "$WORKSPACE/guides/$national" ]]; then
              occupied+=(--occupied-guide "$WORKSPACE/guides/$national")
            fi
          done
          python3 "$WORKSPACE/scripts/grab_snrt.py" \
            --channels "$WORKSPACE/epg/snrt-ma.channels.xml" \
            --aliases "$WORKSPACE/epg/aliases-arabic.json" \
            --days 2 \
            --output "$OUTPUT_DIR/snrt.xml" \
            --append-to "$OUTPUT_DIR/guide-arabic.xml" \
            "${occupied[@]}"
          echo "upstream=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "elapsed=$(($(date +%s)-started))" >> "$GITHUB_OUTPUT"
          echo "Arabic trial complete: $(stat -c%s "$OUTPUT_DIR/guide-arabic.xml") bytes"

      - name: Apply Xtream display aliases and channel clones
        if: success()
        env:
          FINAL_GUIDE: ${{ runner.temp }}/guide-arabic.final.xml
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/arabic-epg-output/guide-arabic.xml"
          python3 scripts/process-epg.py \
            --input "$RUNNER_TEMP/arabic-epg-output/guide-arabic.xml" \
            --output "$FINAL_GUIDE" \
            --profile arabic \
            --aliases epg/aliases-arabic.json \
            --xtream-aliases epg/xtream-aliases-arabic.json \
            --min-channels 50 \
            --min-programmes 1000

      - name: Validate and publish Arabic national guide
        if: success()
        env:
          GENERATED_GUIDE: ${{ runner.temp }}/guide-arabic.final.xml
          RAW_GUIDE: ${{ runner.temp }}/arabic-epg-output/guide-arabic.xml
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GENERATED_GUIDE"
          git diff --quiet "$SOURCE_SHA" -- scripts/arabic-epg.py scripts/grab_snrt.py scripts/merge-national-guides.py scripts/process-epg.py .github/workflows epg || {
            echo "::error::Arabic generation code changed during the run; refusing stale output."
            exit 1
          }
          python3 scripts/national_publish_validate.py "$GENERATED_GUIDE" guides/guide-arabic.xml --region Arabic
          python3 - "$GENERATED_GUIDE" <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from xtream_publish_warnings import warn_missing_configured_channels
          guide_path = Path(sys.argv[1])
          root = ET.parse(guide_path).getroot()
          channels = {c.get("id") for c in root.findall("channel")}
          aliases = json.loads(Path("epg/aliases-arabic.json").read_text(encoding="utf-8"))
          xtream = json.loads(Path("epg/xtream-aliases-arabic.json").read_text(encoding="utf-8"))
          warn_missing_configured_channels("Arabic", channels, aliases, xtream)
          print(f"Validated Arabic Xtream layer: {len(channels)} channels, {len(xtream)} clone IDs")
          PY
          install -m 644 "$GENERATED_GUIDE" guides/.guide-arabic.xml.tmp
          mv -f guides/.guide-arabic.xml.tmp guides/guide-arabic.xml
          bash scripts/ci/publish-xmltv.sh "chore(epg): update Arabic guide" guides/guide-arabic.xml
