name: Generate Italian EPG

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-publish-guide-it
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download upstream iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git upstream

      - name: Install upstream dependencies
        working-directory: upstream
        run: |
          npm ci --ignore-scripts
          npm run api:load

      - name: Generate Italian coverage
        id: generate
        working-directory: upstream
        env:
          OUTPUT_DIR: ${{ runner.temp }}/it-epg-output
          HELPER: ${{ github.workspace }}/scripts/it-epg.py
          WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$OUTPUT_DIR"
          sources=(
            "sky:sites/guidatv.sky.it/guidatv.sky.it.channels.xml"
            "mediaset:sites/mediasetinfinity.mediaset.it/mediasetinfinity.mediaset.it.channels.xml"
            "rai:sites/raiplay.it/raiplay.it.channels.xml"
            "tivu:sites/tivu.tv/tivu.tv.channels.xml"
          )
          covered_guides=()
          merge_sources=()
          run_source() {
            local name="$1" catalog="$2"
            local selected="$OUTPUT_DIR/$name.channels.xml"
            local guide="$OUTPUT_DIR/$name.xml"
            local args=(select --catalog "$catalog" --output "$selected" --source "$name")
            for prior in "${covered_guides[@]}"; do args+=(--covered-guide "$prior"); done
            count=$(python3 "$HELPER" "${args[@]}") || return 0
            echo "$name: $count uncovered channels selected"
            if [[ "$count" == "0" ]]; then return 0; fi
            set +e
            npm run grab -- --channels="$selected" --days=2 --maxConnections=3 --timeout=15000 "--output=$guide" 2>&1 | tee "$OUTPUT_DIR/$name.log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$OUTPUT_DIR/$name.status"
            if [[ -s "$guide" ]] && python3 - "$guide" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          good=[p for p in root.findall('programme') if (p.findtext('title') or '').strip()]
          raise SystemExit(0 if root.tag=='tv' and good else 1)
          PY
            then
              covered_guides+=("$guide")
              merge_sources+=("$name=$guide,$catalog")
            else
              echo "$name: no valid output"
            fi
          }
          set -e
          for entry in "${sources[@]}"; do
            IFS=: read -r name catalog <<< "$entry"
            run_source "$name" "$catalog"
          done
          occupied=()
          for national in guide-es.xml guide-fr.xml guide-arabic.xml guide-gb.xml guide-pt.xml guide-nl.xml; do
            if [[ -f "$WORKSPACE/$national" ]]; then
              occupied+=(--occupied-guide "$WORKSPACE/$national")
            fi
          done
          merge_args=(merge --output "$OUTPUT_DIR/guide-it.raw.xml")
          for pair in "${merge_sources[@]}"; do
            merge_args+=(--source "$pair")
          done
          if [[ -f "$WORKSPACE/guide-it.xml" ]]; then
            merge_args+=(--canonical-guide "$WORKSPACE/guide-it.xml")
          fi
          python3 "$HELPER" "${merge_args[@]}" "${occupied[@]}"

      - name: Apply Xtream display aliases
        if: success()
        env:
          FINAL_GUIDE: ${{ runner.temp }}/guide-it.final.xml
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/it-epg-output/guide-it.raw.xml"
          python3 scripts/process-epg.py \
            --input "$RUNNER_TEMP/it-epg-output/guide-it.raw.xml" \
            --output "$FINAL_GUIDE" \
            --profile it \
            --aliases epg/aliases-it.json \
            --xtream-aliases epg/xtream-aliases-it.json \
            --min-channels 80 \
            --min-programmes 5000

      - name: Validate and publish Italian national guide
        if: success()
        env:
          GENERATED_GUIDE: ${{ runner.temp }}/guide-it.final.xml
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GENERATED_GUIDE"
          git diff --quiet "$SOURCE_SHA" -- scripts/it-epg.py scripts/it_catalog_match.py scripts/merge-national-guides.py scripts/process-epg.py .github/workflows epg || {
            echo "::error::Italian generation code changed during the run; refusing stale output."
            exit 1
          }
          python3 scripts/it_publish_validate.py "$GENERATED_GUIDE" guide-it.xml
          install -m 644 "$GENERATED_GUIDE" .guide-it.xml.tmp
          mv -f .guide-it.xml.tmp guide-it.xml
          bash scripts/ci/publish-xmltv.sh "chore(epg): update Italian national guide" guide-it.xml