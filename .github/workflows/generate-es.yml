name: Generate Spanish EPG

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-publish-guide-es
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run api:load

      - name: Run Movistar grabber
        run: |
          mkdir -p "$RUNNER_TEMP/epg-output"
          npm run grab -- --channels=sites/movistarplus.es/movistarplus.es.channels.xml --discover-channels --maxConnections=3 --days=2 --timeout=10000 --output="$RUNNER_TEMP/epg-output/movistar.xml"
          test -s "$RUNNER_TEMP/epg-output/movistar.xml"

      - name: Run selected Orange grabber
        continue-on-error: true
        run: |
          node scripts/commands/epg/grab-orange.cjs --channels=sites/orangetv.orange.es/orange-selected.channels.xml --days=2 --output="$RUNNER_TEMP/epg-output/orange.xml"
          test -s "$RUNNER_TEMP/epg-output/orange.xml"

      - name: Run selected El País grabber
        continue-on-error: true
        run: |
          npm run grab -- --channels=sites/programacion-tv.elpais.com/elpais-selected.channels.xml --maxConnections=3 --days=2 --timeout=10000 --output="$RUNNER_TEMP/epg-output/elpais.xml"
          test -s "$RUNNER_TEMP/epg-output/elpais.xml"

      - name: Run EPGShare Rally.TV grabber
        run: |
          python scripts/grab_epgshare.py --channels=epg/epgshare-rally.channels.xml --days=2 --output="$RUNNER_TEMP/epg-output/epgshare.xml"
          test -s "$RUNNER_TEMP/epg-output/epgshare.xml"

      - name: Merge source guides
        env:
          OUTPUT_DIR: ${{ runner.temp }}/epg-output
        run: |
          python scripts/merge-guides.py --movistar "$OUTPUT_DIR/movistar.xml" --orange "$OUTPUT_DIR/orange.xml" --elpais "$OUTPUT_DIR/elpais.xml" --epgshare "$OUTPUT_DIR/epgshare.xml" --output "$OUTPUT_DIR/guide.merged.xml"

      - name: Process and validate Spanish XMLTV
        id: validate
        env:
          FINAL_GUIDE: ${{ runner.temp }}/epg-output/guide.final.xml
        run: |
          mkdir -p "$(dirname "$FINAL_GUIDE")"
          python scripts/process-epg.py --input "$RUNNER_TEMP/epg-output/guide.merged.xml" --output "$FINAL_GUIDE"
          python - "$FINAL_GUIDE" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from xtream_publish_warnings import warn_missing_configured_channels

          guide_path = Path(sys.argv[1])
          root = ET.parse(guide_path).getroot()
          channels = {node.get("id"): node for node in root.findall("channel")}
          programmes = root.findall("programme")
          aliases = json.loads(Path("epg/aliases.json").read_text(encoding="utf-8"))
          xtream = json.loads(Path("epg/xtream-aliases.json").read_text(encoding="utf-8"))

          if len(channels) < 100:
              raise SystemExit(f"Definitive guide has only {len(channels)} channels (minimum 100)")
          if len(programmes) < 1000:
              raise SystemExit(f"Definitive guide has only {len(programmes)} programmes (minimum 1000)")
          warn_missing_configured_channels("Spanish", channels, aliases, xtream)
          print(
              f"Validated definitive guide: {len(channels)} channels, "
              f"{len(programmes)} programmes, {len(aliases)} display-alias IDs, "
              f"{len(xtream)} Xtream IDs"
          )
          PY

      - name: Publish Spanish national guide
        env:
          SPANISH_GUIDE: ${{ runner.temp }}/epg-output/guide.final.xml
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SPANISH_GUIDE"
          git diff --quiet "$SOURCE_SHA" -- scripts/process-epg.py scripts/merge-guides.py scripts/merge-national-guides.py scripts/grab_epgshare.py scripts/build_xtream_mappings.py scripts/xtream_matching.py .github/workflows scripts/commands/epg scripts/core scripts/models sites epg || {
            echo "::error::Generation code or channel configuration changed during the run. Refusing to publish stale output."
            exit 1
          }
          install -m 644 "$SPANISH_GUIDE" .guide-es.xml.tmp
          mv -f .guide-es.xml.tmp guide-es.xml
          bash scripts/ci/publish-xmltv.sh "chore(epg): update Spanish national guide" guide-es.xml
