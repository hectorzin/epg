name: Generate Canadian EPG

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-publish-guide-ca
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download upstream iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git upstream

      - name: Install upstream dependencies
        working-directory: upstream
        run: |
          npm ci --ignore-scripts
          npm run api:load

      - name: Generate Canadian coverage
        id: generate
        working-directory: upstream
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ca-epg-output
          HELPER: ${{ github.workspace }}/scripts/ca-epg.py
          STATIONS: ${{ github.workspace }}/epg/ca-stations.json
          WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$OUTPUT_DIR"
          occupied_files=()
          for national in guide-es.xml guide-fr.xml guide-arabic.xml guide-gb.xml guide-pt.xml guide-nl.xml guide-it.xml guide-de.xml guide-tr.xml guide-be.xml; do
            if [[ -f "$WORKSPACE/guides/$national" ]]; then
              occupied_files+=("$WORKSPACE/guides/$national")
            fi
          done
          covered_guides=("${occupied_files[@]}")
          merge_sources=()
          grab_iptv() {
            local name="$1" catalog="$2"
            local selected="$OUTPUT_DIR/$name.channels.xml"
            local guide="$OUTPUT_DIR/$name.xml"
            local args=(select --stations "$STATIONS" --catalog "$catalog" --output "$selected")
            for prior in "${covered_guides[@]}"; do args+=(--covered-guide "$prior"); done
            count=$(python3 "$HELPER" "${args[@]}") || return 0
            echo "$name: $count uncovered channels selected"
            if [[ "$count" == "0" ]]; then return 0; fi
            set +e
            npm run grab -- --channels="$selected" --days=2 --maxConnections=1 --timeout=20000 "--output=$guide" 2>&1 | tee "$OUTPUT_DIR/$name.log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$OUTPUT_DIR/$name.status"
            if [[ -s "$guide" ]] && python3 - "$guide" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          good=[p for p in root.findall('programme') if (p.findtext('title') or '').strip()]
          raise SystemExit(0 if root.tag=='tv' and good else 1)
          PY
            then
              covered_guides+=("$guide")
              merge_sources+=("$name=$guide,$selected")
            else
              echo "$name: no valid output"
            fi
          }
          grab_site_file() {
            local name="$1" site="$2"
            local selected="$OUTPUT_DIR/$name.channels.xml"
            local guide="$OUTPUT_DIR/$name.xml"
            local args=(select --stations "$STATIONS" --site "$site" --output "$selected")
            for prior in "${covered_guides[@]}"; do args+=(--covered-guide "$prior"); done
            count=$(python3 "$HELPER" "${args[@]}") || return 0
            echo "$name: $count uncovered channels selected"
            if [[ "$count" == "0" ]]; then return 0; fi
            set +e
            if [[ "$name" == "epgshare" ]]; then
              python3 "$WORKSPACE/scripts/grab_epgshare.py" --channels="$selected" --days=2 --output="$guide"
            else
              python3 "$HELPER" grab-openepg --channels="$selected" --days=2 --output="$guide"
            fi
            local status=$?
            set -e
            echo "$status" > "$OUTPUT_DIR/$name.status"
            if [[ -s "$guide" ]] && python3 - "$guide" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          good=[p for p in root.findall('programme') if (p.findtext('title') or '').strip()]
          raise SystemExit(0 if root.tag=='tv' and good else 1)
          PY
            then
              covered_guides+=("$guide")
              merge_sources+=("$name=$guide,$selected")
            else
              echo "$name: no valid output"
            fi
          }
          set -e
          grab_iptv tvhebdo sites/tvhebdo.com/tvhebdo.com.channels.xml
          grab_site_file epgshare epgshare01.online
          grab_site_file openepg open-epg.com
          if [[ "${#merge_sources[@]}" -eq 0 ]]; then
            echo "::error::no Canadian source produced a guide"
            exit 1
          fi
          merge_args=(merge --stations "$STATIONS" --output "$OUTPUT_DIR/guide-ca.raw.xml")
          for pair in "${merge_sources[@]}"; do
            merge_args+=(--source "$pair")
          done
          for prior in "${occupied_files[@]}"; do
            merge_args+=(--occupied-guide "$prior")
          done
          if [[ -f "$WORKSPACE/guides/guide-ca.xml" ]]; then
            merge_args+=(--canonical-guide "$WORKSPACE/guides/guide-ca.xml")
          fi
          python3 "$HELPER" "${merge_args[@]}"

      - name: Apply Xtream display aliases and channel clones
        if: success()
        env:
          FINAL_GUIDE: ${{ runner.temp }}/guide-ca.final.xml
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ca-epg-output/guide-ca.raw.xml"
          python3 scripts/process-epg.py \
            --input "$RUNNER_TEMP/ca-epg-output/guide-ca.raw.xml" \
            --output "$FINAL_GUIDE" \
            --profile ca \
            --aliases epg/aliases-ca.json \
            --xtream-aliases epg/xtream-aliases-ca.json \
            --min-channels 80 \
            --min-programmes 1000

      - name: Validate and publish Canadian national guide
        if: success()
        env:
          GENERATED_GUIDE: ${{ runner.temp }}/guide-ca.final.xml
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GENERATED_GUIDE"
          git diff --quiet "$SOURCE_SHA" -- scripts/ca-epg.py scripts/ca_publish_validate.py scripts/grab_epgshare.py scripts/merge-national-guides.py scripts/process-epg.py scripts/xtream_matching.py .github/workflows epg || {
            echo "::error::Canadian generation code changed during the run; refusing stale output."
            exit 1
          }
          python3 scripts/ca_publish_validate.py "$GENERATED_GUIDE" guides/guide-ca.xml
          install -m 644 "$GENERATED_GUIDE" guides/.guide-ca.xml.tmp
          mv -f guides/.guide-ca.xml.tmp guides/guide-ca.xml
          bash scripts/ci/publish-xmltv.sh "chore(epg): update Canadian national guide" guides/guide-ca.xml
