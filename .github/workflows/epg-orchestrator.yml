name: EPG orchestrator

on:
  workflow_dispatch:
    inputs:
      merge_only:
        description: Merge only the national guides already published on main
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: epg-orchestrator
  cancel-in-progress: false

jobs:
  spain:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-es.yml
    secrets: inherit

  france:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-fr.yml
    secrets: inherit

  arabic:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-arabic.yml
    secrets: inherit

  britain:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-gb.yml
    secrets: inherit

  portugal:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-pt.yml
    secrets: inherit

  netherlands:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-nl.yml
    secrets: inherit

  italy:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-it.yml
    secrets: inherit

  germany:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-de.yml
    secrets: inherit

  turkey:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-tr.yml
    secrets: inherit

  belgium:
    if: ${{ inputs.merge_only != true }}
    uses: ./.github/workflows/generate-be.yml
    secrets: inherit

  merge-global:
    needs: [spain, france, arabic, britain, portugal, netherlands, italy, germany, turkey, belgium]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    concurrency:
      group: epg-publish-guide-global
      cancel-in-progress: false
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Merge national guides into global guide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/ci/publish-global-guide.sh . guides/guide.xml.gz "chore(epg): update global guide"
      - name: Report generator outcomes
        if: always()
        run: |
          {
            echo "## EPG orchestrator"
            echo "- Spain: ${{ needs.spain.result }}"
            echo "- France: ${{ needs.france.result }}"
            echo "- Arabic: ${{ needs.arabic.result }}"
            echo "- Britain: ${{ needs.britain.result }}"
            echo "- Portugal: ${{ needs.portugal.result }}"
            echo "- Netherlands: ${{ needs.netherlands.result }}"
            echo "- Italy: ${{ needs.italy.result }}"
            echo "- Germany: ${{ needs.germany.result }}"
            echo "- Turkey: ${{ needs.turkey.result }}"
            echo "- Belgium: ${{ needs.belgium.result }}"
            echo "- Global merge: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
