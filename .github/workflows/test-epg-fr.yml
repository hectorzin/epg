name: Test French EPG (upstream)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Download upstream iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git upstream
      - name: Record upstream revision
        id: upstream
        working-directory: upstream
        run: |
          revision="$(git rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $revision"
      - name: Install upstream dependencies
        working-directory: upstream
        run: npm ci --ignore-scripts
      - name: Load upstream channel metadata
        working-directory: upstream
        run: npm run api:load
      - name: Generate SFR, Canal+ and TVCeSoir coverage
        working-directory: upstream
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.revision }}
        run: |
          set -uo pipefail
          mkdir -p output
          started=$(date +%s)
          echo "$started" > output/start-time
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def read(path): return ET.parse(path).getroot().findall('channel')
          def select(path):
              seen=set(); out=[]
              for c in read(path):
                  i=(c.get('xmltv_id') or '').strip()
                  if c.get('lang')=='fr' and i and i not in seen:
                      seen.add(i); out.append(c)
              return out
          def write(path, rows):
              root=ET.Element('channels')
              for c in rows:
                  n=ET.SubElement(root,'channel',c.attrib); n.text=c.text
              ET.indent(root,space='  '); ET.ElementTree(root).write(path,encoding='utf-8',xml_declaration=True)
          sfr=select('sites/tv.sfr.fr/tv.sfr.fr.channels.xml')
          canal=select('sites/canalplus.com/canalplus.com_fr.channels.xml')
          soir=select('sites/tvcesoir.fr/tvcesoir.fr.channels.xml')
          write('fr-sfr.channels.xml',sfr); write('fr-canalplus.channels.xml',canal); write('fr-tvcesoir.channels.xml',soir)
          print(f'Catalogs: SFR {len(sfr)}, Canal+ FR {len(canal)}, TVCeSoir {len(soir)}')
          PY
          run_grab() {
            local name="$1"; shift
            set +e
            npm run grab -- --channels="$name.channels.xml" --days=2 --maxConnections=3 --timeout=15000 --output="output/$name.xml" 2>&1 | tee "output/$name.log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "output/$name.status"
          }
          run_grab sfr
          select_uncovered() {
            python3 - "$1" "$2" "$3" <<'PY'
          import sys,xml.etree.ElementTree as ET
          source, guide, target=sys.argv[1:]
          try: covered={p.get('channel') for p in ET.parse(guide).getroot().findall('programme')}
          except (OSError,ET.ParseError): covered=set()
          rows=ET.parse(source).getroot().findall('channel'); root=ET.Element('channels'); seen=set()
          for c in rows:
              i=c.get('xmltv_id')
              if i in covered or i in seen: continue
              seen.add(i); n=ET.SubElement(root,'channel',c.attrib); n.text=c.text
          ET.indent(root,space='  '); ET.ElementTree(root).write(target,encoding='utf-8',xml_declaration=True)
          print(f'{target}: {len(root.findall("channel"))} channels still without programmes')
          PY
          }
          select_uncovered fr-canalplus.channels.xml output/sfr.xml fr-canalplus-selected.channels.xml
          run_grab fr-canalplus-selected
          mv output/fr-canalplus-selected.xml output/canalplus.xml 2>/dev/null || true
          # Point each later source to the accumulated valid coverage.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          roots=[]
          for f in ['output/sfr.xml','output/fr-canalplus-selected.xml']:
              try: roots.append(ET.parse(f).getroot())
              except (OSError,ET.ParseError): pass
          covered={p.get('channel') for r in roots for p in r.findall('programme')}
          source=ET.parse('fr-tvcesoir.channels.xml').getroot(); out=ET.Element('channels'); seen=set()
          for c in source.findall('channel'):
              i=c.get('xmltv_id')
              if i in covered or i in seen: continue
              seen.add(i); n=ET.SubElement(out,'channel',c.attrib); n.text=c.text
          ET.indent(out,space='  '); ET.ElementTree(out).write('fr-tvcesoir-selected.channels.xml',encoding='utf-8',xml_declaration=True)
          print(f'TVCeSoir selected: {len(out.findall("channel"))}')
          PY
          run_grab fr-tvcesoir-selected
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, pathlib,time
          from pathlib import Path
          sources=[('SFR','output/sfr.xml','fr-sfr.channels.xml','output/sfr.log'),('Canal+ Francia','output/fr-canalplus-selected.xml','fr-canalplus-selected.channels.xml','output/fr-canalplus-selected.log'),('TVCeSoir','output/fr-tvcesoir-selected.xml','fr-tvcesoir-selected.channels.xml','output/fr-tvcesoir-selected.log')]
          lines=['## French EPG upstream trial','',f'- Upstream commit: `{__import__("os").environ.get("UPSTREAM_SHA")}`']
          all_channels={}; program_keys=set(); programmed=set()
          for label,guid,path,log in sources:
              try: root=ET.parse(guid).getroot()
              except (OSError,ET.ParseError): root=ET.Element('tv')
              requested=len(ET.parse(path).getroot().findall('channel'))
              ps=root.findall('programme'); covered={p.get('channel') for p in ps}
              for c in root.findall('channel'): all_channels.setdefault(c.get('id'),c)
              for p in ps:
                  key=(p.get('channel'),p.get('start'),p.get('stop'),p.findtext('title'))
                  if key in program_keys: continue
                  program_keys.add(key); programmed.add(p.get('channel'))
              errors=Path(log).read_text(errors='replace').count('ERR:') if Path(log).exists() else 0
              status=Path(guid.replace('.xml','.status')).read_text().strip() if Path(guid.replace('.xml','.status')).exists() else 'n/a'
              lines.append(f'- **{label}:** requested {requested}; with programming {len(covered)}; without {max(0,requested-len(covered))}; programmes {len(ps)}; grabber errors {errors}; exit {status}; additional recovered {len(covered-programmed)}')
          lines += ['',f'- Combined distinct channels {len(all_channels)}; with programming {len(programmed)}; deduplicated programmes {len(program_keys)}',f'- Elapsed seconds {time.time()-float(Path("output/start-time").read_text()):.1f}']
          Path('output/summary.md').write_text('\n'.join(lines)+'\n',encoding='utf8')
          print(Path('output/summary.md').read_text())
          PY
      - name: Publish GitHub Actions summary
        if: always()
        run: |
          if [[ -f upstream/output/summary.md ]]; then cat upstream/output/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "French EPG summary unavailable; inspect generation logs." >> "$GITHUB_STEP_SUMMARY"; fi
