name: Generate French EPG

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-publish-guide-fr
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download upstream iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git upstream

      - name: Record upstream revision
        id: upstream
        working-directory: upstream
        run: |
          revision="$(git rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $revision"

      - name: Install upstream dependencies
        working-directory: upstream
        run: npm ci --ignore-scripts

      - name: Load upstream channel metadata
        working-directory: upstream
        run: npm run api:load

      - name: Generate SFR, Canal+ and Telecablesat coverage
        working-directory: upstream
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.revision }}
        run: |
          set -uo pipefail
          mkdir -p output
          started=$(date +%s)
          echo "$started" > output/start-time
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def read(path): return ET.parse(path).getroot().findall('channel')
          def select(path):
              seen=set(); out=[]
              for c in read(path):
                  i=(c.get('xmltv_id') or '').strip()
                  if c.get('lang')=='fr' and i and i not in seen:
                      seen.add(i); out.append(c)
              return out
          def write(path, rows):
              root=ET.Element('channels')
              for c in rows:
                  n=ET.SubElement(root,'channel',c.attrib); n.text=c.text
              ET.indent(root,space='  '); ET.ElementTree(root).write(path,encoding='utf-8',xml_declaration=True)
          sfr=select('sites/tv.sfr.fr/tv.sfr.fr.channels.xml')
          canal=select('sites/canalplus.com/canalplus.com_fr.channels.xml')
          soir=select('sites/tv-programme.telecablesat.fr/tv-programme.telecablesat.fr.channels.xml')
          write('fr-sfr.channels.xml',sfr); write('fr-canalplus.channels.xml',canal); write('fr-telecablesat.channels.xml',soir)
          print(f'Catalogs: SFR {len(sfr)}, Canal+ FR {len(canal)}, Telecablesat {len(soir)}')
          PY
          run_grab() {
            local name="$1" channels="$2"
            set +e
            npm run grab -- --channels="$channels" --days=2 --maxConnections=3 --timeout=15000 --output="output/$name.xml" 2>&1 | tee "output/$name.log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "output/$name.status"
            python3 - "$name" "$status" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          name,status=sys.argv[1:]
          path=Path(f'output/{name}.xml')
          try:
              root=ET.parse(path).getroot()
              channels=len(root.findall('channel')); programmes=len(root.findall('programme'))
          except (OSError,ET.ParseError):
              channels=programmes=0
          print(f'GRAB RESULT {name}: path={path} bytes={path.stat().st_size if path.exists() else 0} channels={channels} programmes={programmes} exit={status}')
          PY
          }
          run_grab sfr fr-sfr.channels.xml
          select_uncovered() {
            python3 - "$1" "$2" "$3" <<'PY'
          import sys,xml.etree.ElementTree as ET
          source, guide, target=sys.argv[1:]
          try: covered={p.get('channel') for p in ET.parse(guide).getroot().findall('programme')}
          except (OSError,ET.ParseError): covered=set()
          rows=ET.parse(source).getroot().findall('channel'); root=ET.Element('channels'); seen=set()
          for c in rows:
              i=c.get('xmltv_id')
              if i in covered or i in seen: continue
              seen.add(i); n=ET.SubElement(root,'channel',c.attrib); n.text=c.text
          ET.indent(root,space='  '); ET.ElementTree(root).write(target,encoding='utf-8',xml_declaration=True)
          print(f'{target}: {len(root.findall("channel"))} channels still without programmes')
          PY
          }
          select_uncovered fr-canalplus.channels.xml output/sfr.xml fr-canalplus-selected.channels.xml
          run_grab fr-canalplus-selected fr-canalplus-selected.channels.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          roots=[]
          for f in ['output/sfr.xml','output/fr-canalplus-selected.xml']:
              try: roots.append(ET.parse(f).getroot())
              except (OSError,ET.ParseError): pass
          covered={p.get('channel') for r in roots for p in r.findall('programme')}
          source=ET.parse('fr-telecablesat.channels.xml').getroot(); out=ET.Element('channels'); seen=set()
          for c in source.findall('channel'):
              i=c.get('xmltv_id')
              if i in covered or i in seen: continue
              seen.add(i); n=ET.SubElement(out,'channel',c.attrib); n.text=c.text
          ET.indent(out,space='  '); ET.ElementTree(out).write('fr-telecablesat-selected.channels.xml',encoding='utf-8',xml_declaration=True)
          print(f'Telecablesat selected: {len(out.findall("channel"))}')
          PY
          run_grab fr-telecablesat-selected fr-telecablesat-selected.channels.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, pathlib,time
          from pathlib import Path
          sources=[('SFR','output/sfr.xml','fr-sfr.channels.xml','output/sfr.log'),('Canal+ Francia','output/fr-canalplus-selected.xml','fr-canalplus-selected.channels.xml','output/fr-canalplus-selected.log'),('Telecablesat','output/fr-telecablesat-selected.xml','fr-telecablesat-selected.channels.xml','output/fr-telecablesat-selected.log')]
          lines=['## French EPG upstream trial','',f'- Upstream commit: `{__import__("os").environ.get("UPSTREAM_SHA")}`']
          all_channels={}; program_keys=set(); programmed=set()
          prior_covered=set()
          combined_channels={}; combined_programs=[]; combined_keys=set()
          for label,guid,path,log in sources:
              try: root=ET.parse(guid).getroot()
              except (OSError,ET.ParseError): root=ET.Element('tv')
              requested=len(ET.parse(path).getroot().findall('channel'))
              ps=root.findall('programme'); covered={p.get('channel') for p in ps}
              for c in root.findall('channel'):
                  all_channels.setdefault(c.get('id'),c)
                  combined_channels.setdefault(c.get('id'),c)
              unique_here=0
              for p in ps:
                  key=(p.get('channel'),p.get('start'),p.get('stop'),p.findtext('title'))
                  if key in program_keys: continue
                  program_keys.add(key); combined_keys.add(key); combined_programs.append(p)
                  unique_here+=1; programmed.add(p.get('channel'))
              errors=Path(log).read_text(errors='replace').count('ERR:') if Path(log).exists() else 0
              status_path=Path(guid.replace('.xml','.status'))
              status=status_path.read_text().strip() if status_path.exists() else 'n/a'
              incremental=covered-prior_covered
              prior_covered |= covered
              lines.append(f'- **{label}:** requested {requested}; with programming {len(covered)}; without {max(0,requested-len(covered))}; programmes {len(ps)}; unique programmes added {unique_here}; grabber errors {errors}; exit {status}; additional channels recovered {len(incremental)}')
          if not combined_keys:
              raise SystemExit('No programmes were produced by SFR, Canal+ France, or Telecablesat.')
          combined=ET.Element('tv')
          for c in combined_channels.values(): combined.append(c)
          for p in combined_programs: combined.append(p)
          ET.indent(combined,space='  ')
          ET.ElementTree(combined).write('output/guide-fr.xml',encoding='utf-8',xml_declaration=True)
          checked=ET.parse('output/guide-fr.xml').getroot()
          final_programmes=checked.findall('programme')
          if not final_programmes: raise SystemExit('Combined XMLTV contains zero programmes.')
          if any(p.get('channel') not in combined_channels for p in final_programmes): raise SystemExit('Combined XMLTV has invalid channel references.')
          lines += ['',f'- Combined distinct channels {len(all_channels)}; with programming {len(programmed)}; deduplicated programmes {len(final_programmes)}',f'- Combined XMLTV size {Path("output/guide-fr.xml").stat().st_size} bytes',f'- Elapsed seconds {time.time()-float(Path("output/start-time").read_text()):.1f}']
          Path('output/summary.md').write_text('\n'.join(lines)+'\n',encoding='utf8')
          print(Path('output/summary.md').read_text())
          PY

      - name: Publish GitHub Actions summary
        if: always()
        run: |
          if [[ -f upstream/output/summary.md ]]; then cat upstream/output/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "French EPG summary unavailable; inspect generation logs." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Apply Xtream display aliases and channel clones
        if: success()
        env:
          FINAL_GUIDE: ${{ runner.temp }}/guide-fr.final.xml
        run: |
          set -euo pipefail
          test -s upstream/output/guide-fr.xml
          python3 scripts/process-epg.py \
            --input upstream/output/guide-fr.xml \
            --output "$FINAL_GUIDE" \
            --profile fr \
            --aliases epg/aliases-fr.json \
            --xtream-aliases epg/xtream-aliases-fr.json \
            --min-channels 100 \
            --min-programmes 1000

      - name: Validate and publish French national guide
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_GUIDE: ${{ runner.temp }}/guide-fr.final.xml
        run: |
          set -euo pipefail
          test -s "$FINAL_GUIDE"
          python3 - "$FINAL_GUIDE" guide-fr.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          generated, previous = map(Path, sys.argv[1:])
          root=ET.parse(generated).getroot()
          channels={c.get('id') for c in root.findall('channel')}
          programmes=root.findall('programme')
          if not programmes: raise SystemExit('Generated French guide is empty')
          invalid=[p for p in programmes if p.get('channel') not in channels]
          if invalid: raise SystemExit(f'Generated guide has {len(invalid)} invalid programme channel references')
          current_programmed={p.get('channel') for p in programmes}
          if previous.exists():
              old=ET.parse(previous).getroot()
              old_programmed={p.get('channel') for p in old.findall('programme')}
              if old_programmed:
                  lost=old_programmed-current_programmed
                  ratio=len(lost)/len(old_programmed)
                  if ratio>0.20: raise SystemExit(f'Refusing publication: programmed channel coverage fell by {ratio:.1%} ({len(lost)}/{len(old_programmed)})')
          print(f'Validated French guide: {len(channels)} channels, {len(programmes)} programmes')
          PY
          python3 - "$FINAL_GUIDE" <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          guide_path = Path(sys.argv[1])
          root = ET.parse(guide_path).getroot()
          channels = {c.get("id") for c in root.findall("channel")}
          aliases = json.loads(Path("epg/aliases-fr.json").read_text(encoding="utf-8"))
          xtream = json.loads(Path("epg/xtream-aliases-fr.json").read_text(encoding="utf-8"))
          missing_alias = sorted(set(aliases) - channels)
          missing_xtream = sorted(set(xtream) - channels)
          if missing_alias:
              raise SystemExit("Missing French display-alias channels: " + ", ".join(missing_alias))
          if missing_xtream:
              raise SystemExit("Missing French Xtream clone channels: " + ", ".join(missing_xtream))
          print(f"Validated French Xtream layer: {len(channels)} channels, {len(xtream)} clone IDs")
          PY
          install -m 644 "$FINAL_GUIDE" .guide-fr.xml.tmp
          mv -f .guide-fr.xml.tmp guide-fr.xml
          bash scripts/ci/publish-xmltv.sh "chore(epg): update French national guide" guide-fr.xml