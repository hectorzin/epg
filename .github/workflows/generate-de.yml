name: Generate German EPG

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-publish-guide-de
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download upstream iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git upstream

      - name: Install upstream dependencies
        working-directory: upstream
        run: |
          npm ci --ignore-scripts
          npm run api:load

      - name: Generate German coverage
        id: generate
        working-directory: upstream
        env:
          OUTPUT_DIR: ${{ runner.temp }}/de-epg-output
          HELPER: ${{ github.workspace }}/scripts/de-epg.py
          WORKSPACE: ${{ github.workspace }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$OUTPUT_DIR"
          sources=(
            "magenta:sites/www.magenta.tv/www.magenta.tv.channels.xml"
            "magentaweb:sites/web.magentatv.de/web.magentatv.de.channels.xml"
            "tvheute:sites/tvheute.at/tvheute.at.channels.xml"
          )
          covered_guides=()
          merge_sources=()
          run_source() {
            local name="$1" catalog="$2"
            local selected="$OUTPUT_DIR/$name.channels.xml"
            local guide="$OUTPUT_DIR/$name.xml"
            local args=(select --catalog "$catalog" --output "$selected")
            for prior in "${covered_guides[@]}"; do args+=(--covered-guide "$prior"); done
            count=$(python3 "$HELPER" "${args[@]}") || return 0
            echo "$name: $count uncovered channels selected"
            if [[ "$count" == "0" ]]; then return 0; fi
            set +e
            npm run grab -- --channels="$selected" --days=2 --maxConnections=3 --timeout=20000 "--output=$guide" 2>&1 | tee "$OUTPUT_DIR/$name.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$OUTPUT_DIR/$name.status"
            if [[ -s "$guide" ]] && python3 -c 'import sys, xml.etree.ElementTree as ET; root=ET.parse(sys.argv[1]).getroot(); good=[p for p in root.findall("programme") if (p.findtext("title") or "").strip()]; raise SystemExit(0 if root.tag=="tv" and good else 1)' "$guide"
            then
              covered_guides+=("$guide")
              merge_sources+=("$name=$guide,$catalog")
            else
              echo "$name: no valid output"
            fi
          }
          set -e
          for entry in "${sources[@]}"; do
            IFS=: read -r name catalog <<< "$entry"
            run_source "$name" "$catalog"
          done
          set +e
          python3 "$WORKSPACE/scripts/grab_epgshare.py" --channels="$WORKSPACE/epg/epgshare-rally.channels.xml" --days=2 --output="$OUTPUT_DIR/epgshare.xml"
          epgshare_status=$?
          set -e
          if [[ "$epgshare_status" -eq 0 ]] && [[ -s "$OUTPUT_DIR/epgshare.xml" ]] && python3 -c 'import sys, xml.etree.ElementTree as ET; root=ET.parse(sys.argv[1]).getroot(); good=[p for p in root.findall("programme") if (p.findtext("title") or "").strip()]; raise SystemExit(0 if root.tag=="tv" and good else 1)' "$OUTPUT_DIR/epgshare.xml"
          then
            merge_sources+=("epgshare=$OUTPUT_DIR/epgshare.xml,$WORKSPACE/epg/epgshare-rally.channels.xml")
            echo "epgshare: Rally.TV.de grabbed"
          else
            echo "epgshare: no valid Rally.TV output"
          fi
          magenta_channels=0
          if [[ -s "$OUTPUT_DIR/magenta.xml" ]]; then
            magenta_channels=$(python3 -c 'import sys, xml.etree.ElementTree as ET; root=ET.parse(sys.argv[1]).getroot(); programmed={p.get("channel") for p in root.findall("programme") if (p.findtext("title") or "").strip()}; print(sum(1 for c in root.findall("channel") if c.get("id") in programmed))' "$OUTPUT_DIR/magenta.xml")
          fi
          if [[ "$magenta_channels" -lt 60 ]]; then
            echo "::error::www.magenta.tv produced ${magenta_channels} programmed channels; refusing an incomplete German guide."
            exit 1
          fi
          occupied=()
          for national in guide-es.xml guide-fr.xml guide-arabic.xml guide-gb.xml guide-pt.xml guide-nl.xml guide-it.xml; do
            if [[ -f "$WORKSPACE/$national" ]]; then
              occupied+=(--occupied-guide "$WORKSPACE/$national")
            fi
          done
          merge_args=(merge --output "$OUTPUT_DIR/guide-de.raw.xml")
          for pair in "${merge_sources[@]}"; do
            merge_args+=(--source "$pair")
          done
          if [[ -f "$WORKSPACE/guide-de.xml" ]]; then
            merge_args+=(--canonical-guide "$WORKSPACE/guide-de.xml")
          fi
          python3 "$HELPER" "${merge_args[@]}" "${occupied[@]}"

      - name: Apply Xtream display aliases and channel clones
        if: success()
        env:
          FINAL_GUIDE: ${{ runner.temp }}/guide-de.final.xml
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/de-epg-output/guide-de.raw.xml"
          python3 scripts/process-epg.py \
            --input "$RUNNER_TEMP/de-epg-output/guide-de.raw.xml" \
            --output "$FINAL_GUIDE" \
            --profile de \
            --aliases epg/aliases-de.json \
            --xtream-aliases epg/xtream-aliases-de.json \
            --min-channels 60 \
            --min-programmes 2000

      - name: Validate and publish German national guide
        if: success()
        env:
          GENERATED_GUIDE: ${{ runner.temp }}/guide-de.final.xml
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GENERATED_GUIDE"
          git diff --quiet "$SOURCE_SHA" -- scripts/de-epg.py scripts/de_catalog_match.py scripts/de_publish_validate.py scripts/grab_epgshare.py scripts/merge-national-guides.py scripts/process-epg.py scripts/xtream_matching.py .github/workflows epg || {
            echo "::error::German generation code changed during the run; refusing stale output."
            exit 1
          }
          python3 scripts/de_publish_validate.py "$GENERATED_GUIDE" guide-de.xml
          install -m 644 "$GENERATED_GUIDE" .guide-de.xml.tmp
          mv -f .guide-de.xml.tmp guide-de.xml
          bash scripts/ci/publish-xmltv.sh "chore(epg): update German national guide" guide-de.xml
