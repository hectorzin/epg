name: EPG Grabber

on:
  workflow_dispatch:
  # Reactivar después de validar una ejecución manual.
  # schedule:
  #   - cron: "0 3 * * *" # Todos los días a las 05:00 (Europa/Madrid)

permissions:
  contents: read

jobs:
  grab:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Evita el postinstall; api:load se ejecuta explícitamente porque el grabber
      # necesita los ficheros de temp/data.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run api:load

      - name: Run Movistar grabber
        run: |
          rm -f guide.xml
          npm run grab -- --channels=sites/movistarplus.es/movistarplus.es.channels.xml --discover-channels --maxConnections=3 --days=2 --timeout=10000
          test -s guide.xml

      - name: Process and validate definitive XMLTV
        env:
          FINAL_GUIDE: ${{ runner.temp }}/epg-output/guide.final.xml
        run: |
          mkdir -p "$(dirname "$FINAL_GUIDE")"
          python scripts/process-epg.py --input guide.xml --output "$FINAL_GUIDE"
          python - "$FINAL_GUIDE" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          guide_path = Path(sys.argv[1])
          root = ET.parse(guide_path).getroot()
          channels = {node.get("id"): node for node in root.findall("channel")}
          programmes = root.findall("programme")
          aliases = json.loads(Path("epg/aliases.json").read_text(encoding="utf-8"))
          xtream = json.loads(Path("epg/xtream-aliases.json").read_text(encoding="utf-8"))

          if len(channels) < 100:
              raise SystemExit(f"Definitive guide has only {len(channels)} channels (minimum 100)")
          if len(programmes) < 1000:
              raise SystemExit(f"Definitive guide has only {len(programmes)} programmes (minimum 1000)")
          missing_alias_channels = sorted(set(aliases) - channels.keys())
          if missing_alias_channels:
              raise SystemExit("Missing display-alias channels: " + ", ".join(missing_alias_channels))
          missing_xtream = sorted(set(xtream) - channels.keys())
          if missing_xtream:
              raise SystemExit("Missing Xtream alias channels: " + ", ".join(missing_xtream))
          print(
              f"Validated definitive guide: {len(channels)} channels, "
              f"{len(programmes)} programmes, {len(aliases)} display-alias IDs, "
              f"{len(xtream)} Xtream IDs"
          )
          PY

      - name: Upload definitive XMLTV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: movistarplus-definitive-xmltv
          path: ${{ runner.temp }}/epg-output/guide.final.xml
          if-no-files-found: error
          retention-days: 7
