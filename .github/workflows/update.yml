name: EPG Grabber

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Todos los días a las 03:00 UTC

permissions:
  contents: write

concurrency:
  group: epg-generation-and-publish
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Evita el postinstall; api:load se ejecuta explícitamente porque el grabber
      # necesita los ficheros de temp/data.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run api:load

      - name: Run Movistar grabber
        run: |
          mkdir -p "$RUNNER_TEMP/epg-output"
          npm run grab -- --channels=sites/movistarplus.es/movistarplus.es.channels.xml --discover-channels --maxConnections=3 --days=2 --timeout=10000 --output="$RUNNER_TEMP/epg-output/movistar.xml"
          test -s "$RUNNER_TEMP/epg-output/movistar.xml"

      - name: Run selected Orange grabber
        continue-on-error: true
        run: |
          node scripts/commands/epg/grab-orange.cjs --channels=sites/orangetv.orange.es/orange-selected.channels.xml --days=2 --output="$RUNNER_TEMP/epg-output/orange.xml"
          test -s "$RUNNER_TEMP/epg-output/orange.xml"

      - name: Run selected El País grabber
        continue-on-error: true
        run: |
          npm run grab -- --channels=sites/programacion-tv.elpais.com/elpais-selected.channels.xml --maxConnections=3 --days=2 --timeout=10000 --output="$RUNNER_TEMP/epg-output/elpais.xml"
          test -s "$RUNNER_TEMP/epg-output/elpais.xml"

      - name: Merge source guides
        env:
          OUTPUT_DIR: ${{ runner.temp }}/epg-output
        run: |
          python scripts/merge-guides.py --movistar "$OUTPUT_DIR/movistar.xml" --orange "$OUTPUT_DIR/orange.xml" --elpais "$OUTPUT_DIR/elpais.xml" --output "$OUTPUT_DIR/guide.merged.xml"

      - name: Process and validate Spanish XMLTV
        id: validate
        env:
          FINAL_GUIDE: ${{ runner.temp }}/epg-output/guide.final.xml
        run: |
          mkdir -p "$(dirname "$FINAL_GUIDE")"
          python scripts/process-epg.py --input "$RUNNER_TEMP/epg-output/guide.merged.xml" --output "$FINAL_GUIDE"
          python - "$FINAL_GUIDE" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          guide_path = Path(sys.argv[1])
          root = ET.parse(guide_path).getroot()
          channels = {node.get("id"): node for node in root.findall("channel")}
          programmes = root.findall("programme")
          aliases = json.loads(Path("epg/aliases.json").read_text(encoding="utf-8"))
          xtream = json.loads(Path("epg/xtream-aliases.json").read_text(encoding="utf-8"))

          if len(channels) < 100:
              raise SystemExit(f"Definitive guide has only {len(channels)} channels (minimum 100)")
          if len(programmes) < 1000:
              raise SystemExit(f"Definitive guide has only {len(programmes)} programmes (minimum 1000)")
          missing_alias_channels = sorted(set(aliases) - channels.keys())
          if missing_alias_channels:
              raise SystemExit("Missing display-alias channels: " + ", ".join(missing_alias_channels))
          missing_xtream = sorted(set(xtream) - channels.keys())
          if missing_xtream:
              raise SystemExit("Missing Xtream alias channels: " + ", ".join(missing_xtream))
          print(
              f"Validated definitive guide: {len(channels)} channels, "
              f"{len(programmes)} programmes, {len(aliases)} display-alias IDs, "
              f"{len(xtream)} Xtream IDs"
          )
          PY
      - name: Merge national guides
        env:
          OUTPUT_DIR: ${{ runner.temp }}/epg-output
        run: |
          guides=("$OUTPUT_DIR/guide.final.xml")
          if [[ -s guide-es.xml ]]; then
            guides+=(guide-es.xml)
          elif [[ -s guide.xml ]]; then
            guides+=(guide.xml)
          fi
          if [[ -s guide-fr.xml ]]; then guides+=(guide-fr.xml); fi
          python scripts/merge-national-guides.py --output "$OUTPUT_DIR/guide.xml" "${guides[@]}"
          python - "$OUTPUT_DIR/guide.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          if not root.findall('programme'):
              raise SystemExit('Global guide has no programmes')
          print(f"Validated global guide: {len(root.findall('channel'))} channels, {len(root.findall('programme'))} programmes")
          PY

      - name: Publish Spanish and global guides
        env:
          SPANISH_GUIDE: ${{ runner.temp }}/epg-output/guide.final.xml
          GLOBAL_GUIDE: ${{ runner.temp }}/epg-output/guide.xml
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SPANISH_GUIDE"
          test -s "$GLOBAL_GUIDE"
          git diff --quiet "$SOURCE_SHA" -- scripts/process-epg.py scripts/merge-guides.py scripts/merge-national-guides.py .github/workflows/update.yml scripts/commands/epg scripts/core scripts/models sites epg || {
            echo "::error::Generation code or channel configuration changed during the run. Refusing to publish stale output."
            exit 1
          }
          install -m 644 "$SPANISH_GUIDE" .guide-es.xml.tmp
          install -m 644 "$GLOBAL_GUIDE" .guide.xml.tmp
          mv -f .guide-es.xml.tmp guide-es.xml
          mv -f .guide.xml.tmp guide.xml
          git add -f -- guide-es.xml guide.xml
          if git diff --cached --quiet -- guide-es.xml guide.xml; then
            echo "Spanish and global guides are unchanged."
            exit 0
          fi
          git config user.name "epg-bot[bot]"
          git config user.email "epg-bot[bot]@users.noreply.github.com"
          git commit -m "chore(epg): update Spanish and global guides"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/main
