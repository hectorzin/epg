name: EPG Grabber

on:
  workflow_dispatch:
    inputs:
      publish_to_repo:
        description: Publicar guide.xml en main después de revisar el artefacto
        type: boolean
        required: true
        default: false
  # Reactivar después de validar una ejecución manual.
  # schedule:
  #   - cron: "0 3 * * *" # Todos los días a las 05:00 (Europa/Madrid)

permissions:
  contents: read

concurrency:
  group: epg-generation-and-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    outputs:
      guide_sha256: ${{ steps.validate.outputs.guide_sha256 }}
      baseline_guide_sha256: ${{ steps.baseline.outputs.guide_sha256 }}
      source_sha: ${{ steps.baseline.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Capture guide baseline
        id: baseline
        shell: bash
        run: |
          if [[ -f guide.xml ]]; then
            baseline="$(sha256sum guide.xml | cut -d' ' -f1)"
          else
            baseline=missing
          fi
          echo "guide_sha256=$baseline" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Evita el postinstall; api:load se ejecuta explícitamente porque el grabber
      # necesita los ficheros de temp/data.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run api:load

      - name: Run Movistar grabber
        run: |
          rm -f guide.xml
          npm run grab -- --channels=sites/movistarplus.es/movistarplus.es.channels.xml --discover-channels --maxConnections=3 --days=2 --timeout=10000
          test -s guide.xml

      - name: Process and validate definitive XMLTV
        id: validate
        env:
          FINAL_GUIDE: ${{ runner.temp }}/epg-output/guide.final.xml
        run: |
          mkdir -p "$(dirname "$FINAL_GUIDE")"
          python scripts/process-epg.py --input guide.xml --output "$FINAL_GUIDE"
          python - "$FINAL_GUIDE" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          guide_path = Path(sys.argv[1])
          root = ET.parse(guide_path).getroot()
          channels = {node.get("id"): node for node in root.findall("channel")}
          programmes = root.findall("programme")
          aliases = json.loads(Path("epg/aliases.json").read_text(encoding="utf-8"))
          xtream = json.loads(Path("epg/xtream-aliases.json").read_text(encoding="utf-8"))

          if len(channels) < 100:
              raise SystemExit(f"Definitive guide has only {len(channels)} channels (minimum 100)")
          if len(programmes) < 1000:
              raise SystemExit(f"Definitive guide has only {len(programmes)} programmes (minimum 1000)")
          missing_alias_channels = sorted(set(aliases) - channels.keys())
          if missing_alias_channels:
              raise SystemExit("Missing display-alias channels: " + ", ".join(missing_alias_channels))
          missing_xtream = sorted(set(xtream) - channels.keys())
          if missing_xtream:
              raise SystemExit("Missing Xtream alias channels: " + ", ".join(missing_xtream))
          print(
              f"Validated definitive guide: {len(channels)} channels, "
              f"{len(programmes)} programmes, {len(aliases)} display-alias IDs, "
              f"{len(xtream)} Xtream IDs"
          )
          PY
          echo "guide_sha256=$(sha256sum "$FINAL_GUIDE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload definitive XMLTV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: movistarplus-definitive-xmltv
          path: ${{ runner.temp }}/epg-output/guide.final.xml
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_to_repo == true
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated XMLTV artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: movistarplus-definitive-xmltv
          path: ${{ runner.temp }}/epg-output

      - name: Verify artifact checksum
        env:
          EXPECTED_SHA256: ${{ needs.generate.outputs.guide_sha256 }}
          GUIDE_PATH: ${{ runner.temp }}/epg-output/guide.final.xml
        run: |
          actual_sha256="$(sha256sum "$GUIDE_PATH" | cut -d' ' -f1)"
          [[ "$actual_sha256" == "$EXPECTED_SHA256" ]] || {
            echo "::error::Downloaded XMLTV artifact does not match the validated checksum."
            exit 1
          }

      - name: Check out main for publication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Publish validated guide to main
        env:
          GUIDE_PATH: ${{ runner.temp }}/epg-output/guide.final.xml
          EXPECTED_SHA256: ${{ needs.generate.outputs.guide_sha256 }}
          BASELINE_SHA256: ${{ needs.generate.outputs.baseline_guide_sha256 }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum "$GUIDE_PATH" | cut -d' ' -f1)"
          [[ "$actual_sha256" == "$EXPECTED_SHA256" ]]

          changed=false
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD

            git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD || {
              echo "::error::The generation commit is no longer an ancestor of main. Refusing to publish stale output."
              exit 1
            }
            git diff --quiet "$SOURCE_SHA" FETCH_HEAD -- scripts/process-epg.py scripts/commands/epg scripts/core scripts/models sites epg || {
              echo "::error::Generation code or channel configuration changed while this guide was being built. Rerun generation."
              exit 1
            }

            if [[ -f guide.xml ]]; then
              current_sha256="$(sha256sum guide.xml | cut -d' ' -f1)"
            else
              current_sha256=missing
            fi

            if [[ "$current_sha256" == "$actual_sha256" ]]; then
              echo "main already contains this exact guide; no commit created."
              break
            fi
            if [[ "$current_sha256" != "$BASELINE_SHA256" ]]; then
              echo "::error::guide.xml changed on main after generation began. Refusing to overwrite it."
              exit 1
            fi

            temp_guide=".guide.xml.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tmp"
            trap 'rm -f -- "$temp_guide"' EXIT
            install -m 644 "$GUIDE_PATH" "$temp_guide"
            staged_sha256="$(sha256sum "$temp_guide" | cut -d' ' -f1)"
            [[ "$staged_sha256" == "$actual_sha256" ]]
            mv -f -- "$temp_guide" guide.xml
            git add -f -- guide.xml

            if git diff --cached --quiet -- guide.xml; then
              echo "Guide is unchanged; no commit created."
              break
            fi

            git config user.name "epg-bot[bot]"
            git config user.email "epg-bot[bot]@users.noreply.github.com"
            git commit -m "chore(epg): update definitive guide"
            if git push origin HEAD:refs/heads/main; then
              git fetch --no-tags origin main
              committed_sha256="$(git show FETCH_HEAD:guide.xml | sha256sum | cut -d' ' -f1)"
              [[ "$committed_sha256" == "$actual_sha256" ]]
              changed=true
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::Could not publish after three retries; main was not force-updated."
              exit 1
            fi
            echo "main advanced during publication; rechecking the current guide before retry."
          done

          echo "Guide SHA-256: $actual_sha256"
          [[ "$changed" == 'true' ]] || echo "Publication completed without creating a commit."
